name: shanrail
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: shanrail
      POSTGRES_USER: shanrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55435:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shanrail -d shanrail"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
