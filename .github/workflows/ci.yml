name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SHANRAIL_SEED_PASSWORD: shanrail-ci-only-fixture
      DATABASE_URL: postgresql://shanrail:shanrail_ci@127.0.0.1:5432/shanrail
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: shanrail
          POSTGRES_USER: shanrail
          POSTGRES_PASSWORD: shanrail_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shanrail -d shanrail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm --filter @shanrail/api exec node scripts/auth-smoke.mjs
